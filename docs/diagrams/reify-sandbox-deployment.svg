          <text x="144" y="141" fill="rgba(21,23,19,0.40)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.14em">PUBLIC EDGE · TLS / ROUTING</text>

          <rect x="816" y="72" width="288" height="328" rx="8" fill="rgba(72,107,58,0.03)" stroke="rgba(72,107,58,0.50)" stroke-width="0.8" stroke-dasharray="4,4"/>
          <rect x="832" y="76" width="184" height="12" rx="2" fill="#f7f8f3"/>
