          <text x="624" y="508" fill="#66705f" font-size="9" class="mono" text-anchor="middle">OpenSandbox 调度</text>
          <text x="624" y="524" fill="#66705f" font-size="9" class="mono" text-anchor="middle">quota · audit</text>

          <rect x="840" y="480" width="240" height="112" rx="6" fill="#f7f8f3"/>
          <rect x="840" y="480" width="240" height="112" rx="6" fill="rgba(21,23,19,0.02)" stroke="rgba(21,23,19,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
