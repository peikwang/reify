          <text x="624" y="204" fill="#66705f" font-size="9" class="mono" text-anchor="middle">Host → deployment</text>
          <text x="624" y="220" fill="#66705f" font-size="9" class="mono" text-anchor="middle">token · owner · share</text>
          <text x="624" y="236" fill="#66705f" font-size="9" class="mono" text-anchor="middle">SSE · WS 后续</text>

