<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reify-target-title reify-target-desc">
          <title id="reify-target-title">Reify 目标部署架构：每项目独立轻量沙箱</title>
          <desc id="reify-target-desc">规划中的部署架构：浏览器经 Caddy 访问运行时网关，网关按项目路由到各自的轻量沙箱；控制面负责创建、休眠和销毁沙箱，构建沙箱生成不可变产物并供项目沙箱只读挂载。</desc>

          <defs>
            <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400&amp;display=swap');
              text { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
              .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
              .name { font-weight: 600; }
            </style>
            <marker id="reify-target-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#66705f"/>
            </marker>
            <marker id="reify-target-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
