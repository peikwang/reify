<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reify-current-title reify-current-desc">
          <title id="reify-current-title">Reify 当前运行架构</title>
          <desc id="reify-current-desc">展示浏览器经 Caddy 进入 FastAPI 平台，平台同源托管 React 工作台并连接 SQLite 与用户目录；OpenSandbox 控制面为 React/Next 创建构建沙箱，为 Next 创建运行时沙箱；平台调用外部模型服务。</desc>

