<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reify-arch-title reify-arch-desc">
        <title id="reify-arch-title">Reify 多用户隔离架构</title>
        <desc id="reify-arch-desc">展示浏览器、Caddy、React TypeScript 前端、FastAPI 后端、SQLite、OpenSandbox 构建与 Node 运行时沙箱，以及平台与 SSR 两个 origin 的关系。</desc>

